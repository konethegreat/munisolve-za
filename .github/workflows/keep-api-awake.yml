name: Keep API awake

# Render's free web service sleeps after 15 minutes without traffic. A health
# ping every 10 minutes keeps it warm inside Render's 750 free instance hours
# per month, and stays well inside GitHub Actions' free minutes.
#
# /health is liveness only: it never queries PostgreSQL, so the Neon compute can
# keep auto-suspending between requests.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-api-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        env:
          API_URL: ${{ secrets.MUNISOLVE_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::MUNISOLVE_API_URL repository secret is required."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --max-time 120 \
            "${API_URL%/}/health"
