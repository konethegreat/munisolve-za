# Render Blueprint – backend (server) only.
# Frontend is on Vercel; set Root Directory to "server" for this service in the dashboard if not using this file.

services:
  - type: web
    name: munisolve-api
    runtime: node
    rootDir: server

    # Install deps, generate Prisma client, sync schema to DB (db push is idempotent), then start.
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production
